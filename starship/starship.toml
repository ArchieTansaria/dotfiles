# ~/.config/starship.toml

add_newline = true

format = """
[╭─](fg:#565f89)$directory$git_branch$git_status$nodejs
[╰─](fg:#565f89)$character
"""

[directory]
style = "bold #77C4E6"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#bb9af7"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f7768e"
format = "([$all_status$ahead_behind]($style)) "

[nodejs]
symbol = " "
style = "#73daca"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#565f89"
format = "took [$duration]($style) "

[time]
disabled = false
style = "#565f89"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #77C4E6)"
error_symbol = "[❯](bold #f7768e)"
vicmd_symbol = "[❮](bold #73daca)"

[line_break]
disabled = false

